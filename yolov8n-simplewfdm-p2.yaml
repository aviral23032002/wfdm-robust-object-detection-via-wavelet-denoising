# yolov8n-simplewfdm-p2.yaml
# ===========================================================
# SimpleWFDM at P2 (after C2f, 160x160, 32ch after nano scaling)
#
# WHY P2 IS THE SWEET SPOT:
#   - P1 (16ch): too few channels, weak wavelet signal
#   - P2 (32ch): 2x more channels, corruption still strong at 160x160
#   - P3 (64ch): corruption signal weakening, spatial info lost
#
# WHY NO ALPHA GATE:
#   - alpha=0 init → d(thresh)/dt = 0 → thresholds NEVER learn
#   - IWT(DWT(x)) = x exactly → thresh=0 is safe identity anyway
# ===========================================================
nc: 12
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]       # 0  P1/2  (16ch)
  - [-1, 1, Conv, [128, 3, 2]]      # 1  P2/4  (32ch)
  - [-1, 3, C2f, [128, True]]       # 2  P2    (32ch)
  - [-1, 1, SimpleWFDM, [128]]      # 3  ← DENOISE @ P2 (160x160, 32ch)
  - [-1, 1, Conv, [256, 3, 2]]      # 4  P3/8  (64ch)
  - [-1, 6, C2f, [256, True]]       # 5  P3  ← FPN skip
  - [-1, 1, Conv, [512, 3, 2]]      # 6  P4/16 (128ch)
  - [-1, 6, C2f, [512, True]]       # 7  P4  ← FPN skip
  - [-1, 1, Conv, [1024, 3, 2]]     # 8  P5/32 (256ch)
  - [-1, 3, C2f, [1024, True]]      # 9  P5
  - [-1, 1, SPPF, [1024, 5]]        # 10 SPPF

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 11
  - [[-1, 7], 1, Concat, [1]]                   # 12 cat P4 (index 7)
  - [-1, 3, C2f, [512]]                          # 13

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 14
  - [[-1, 5], 1, Concat, [1]]                   # 15 cat P3 (index 5)
  - [-1, 3, C2f, [256]]                          # 16  ← detect P3/8-small

  - [-1, 1, Conv, [256, 3, 2]]                  # 17
  - [[-1, 13], 1, Concat, [1]]                  # 18 cat head P4
  - [-1, 3, C2f, [512]]                          # 19  ← detect P4/16-medium

  - [-1, 1, Conv, [512, 3, 2]]                  # 20
  - [[-1, 10], 1, Concat, [1]]                  # 21 cat SPPF (index 10)
  - [-1, 3, C2f, [1024]]                         # 22  ← detect P5/32-large

  - [[16, 19, 22], 1, Detect, [nc]]             # 23
