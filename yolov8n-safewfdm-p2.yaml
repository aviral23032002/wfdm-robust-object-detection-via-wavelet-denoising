nc: 12
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]   # 0-P1/2 (16 ch)
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4 (32 ch)
  - [-1, 3, C2f, [128, True]]   # 2-P2   (32 ch)
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8 (64 ch)
  - [-1, 6, C2f, [256, True]]   # 4-P3   (64 ch)
  
  # INTERCEPT: 64 matches the scaled output of Layer 4
  - [-1, 1, SafeWFDM, [64]]     # 5

  - [-1, 1, Conv, [512, 3, 2]]  # 6-P4/16 (128 ch)
  - [-1, 6, C2f, [512, True]]   # 7
  - [-1, 1, Conv, [1024, 3, 2]] # 8-P5/32 (256 ch)
  - [-1, 3, C2f, [1024, True]]  # 9
  - [-1, 1, SPPF, [1024, 5]]    # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 11
  - [[-1, 7], 1, Concat, [1]]  # 12
  - [-1, 3, C2f, [512]]        # 13
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 14
  - [[-1, 5], 1, Concat, [1]]  # 15
  - [-1, 3, C2f, [256]]        # 16
  - [-1, 1, Conv, [256, 3, 2]] # 17
  - [[-1, 13], 1, Concat, [1]] # 18 
  - [-1, 3, C2f, [512]]        # 19
  - [-1, 1, Conv, [512, 3, 2]] # 20
  - [[-1, 10], 1, Concat, [1]] # 21
  - [-1, 3, C2f, [1024]]       # 22
  - [[16, 19, 22], 1, Detect, [nc]] # 23